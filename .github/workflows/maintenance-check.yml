name: MaintenanceCheck

on:
  schedule:
    - cron: "0 0 1 * *" # 毎月1日 00:00 UTC
  workflow_dispatch: {}

# schedule と workflow_dispatch が重なった場合に、endoflife.date/deps.dev への
# 問い合わせが並行して走らないようにする（同時実行はキューさせる、キャンセルはしない）。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  maintenance-check:
    uses: qmonus/qmonus-shared-workflows/.github/workflows/maintenance-check.yml@fc185461378ae61b3bdc04e823859dae5e58b28b # v1.2
    permissions:
      contents: 'read'
